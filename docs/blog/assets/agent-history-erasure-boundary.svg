<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img" aria-labelledby="title desc">
  <title id="title">删除问答内容与保留去重记录</title>
  <desc id="desc">本人删除已结束问答后，问题、答案与引用内容被移除，刷新不再显示；请求身份与累计预算继续保留，旧请求不能重新执行。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
  <g fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M180 58V78H88V102"/><path d="M180 78H272V102"/>
    <path d="M88 190V238"/><path d="M272 190V238"/>
  </g>
  <g stroke-width="1.4">
    <rect x="62" y="10" width="236" height="48" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
    <rect x="10" y="102" width="156" height="88" rx="10" fill="#eff6ff" stroke="#60a5fa"/>
    <rect x="194" y="102" width="156" height="88" rx="10" fill="#fffbeb" stroke="#d6b570"/>
    <rect x="10" y="238" width="156" height="58" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
    <rect x="194" y="238" width="156" height="58" rx="10" fill="#f0fdf4" stroke="#86b99b"/>
  </g>
  <g font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" fill="#1e293b">
    <text x="180" y="40">本人删除已结束问答</text>
    <text x="88" y="136">问题、答案、引用</text><text x="88" y="166">移除内容</text>
    <text x="272" y="136">请求身份、预算</text><text x="272" y="166">保留去重记录</text>
    <text x="88" y="273">刷新不再显示</text><text x="272" y="273">旧请求禁止重跑</text>
  </g>
</svg>
