<svg xmlns="http://www.w3.org/2000/svg" width="360" height="362" viewBox="0 0 360 362" role="img" aria-labelledby="title desc">
  <title id="title">管理员维护的共同事务边界</title>
  <desc id="desc">三类撤权操作汇入角色目录锁和事务写入。最终仍有启用管理员时提交，否则回滚。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 15px; fill: #25364a; text-anchor: middle; dominant-baseline: middle; }
    .node { fill: #edf3fa; stroke: #8098b1; stroke-width: 1.3; }
    .line { fill: none; stroke: #7087a0; stroke-width: 1.5; marker-end: url(#arrow); }
    .success { fill: #e3f3ed; stroke: #588674; }
    .failure { fill: #f9eceb; stroke: #ae7874; }
    @media (prefers-color-scheme: dark) { text { fill: #e3ebf4; } .node { fill: #26394b; stroke: #93abc2; } .line { stroke: #9db1c6; } .success { fill: #25463d; stroke: #84b49f; } .failure { fill: #503837; stroke: #cf9b96; } }
  </style>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="#8098b1"/></marker></defs>
  <rect class="node" x="5" y="8" width="108" height="42" rx="7"/><text x="59" y="29">停用账号</text>
  <rect class="node" x="126" y="8" width="108" height="42" rx="7"/><text x="180" y="29">替换角色</text>
  <rect class="node" x="247" y="8" width="108" height="42" rx="7"/><text x="301" y="29">角色变更</text>
  <path class="line" d="M59 50V68H180V82"/><path class="line" d="M180 50V82"/><path class="line" d="M301 50V68H180V82"/>
  <rect class="node" x="66" y="84" width="228" height="44" rx="7"/><text x="180" y="106">锁定角色目录</text>
  <path class="line" d="M180 128V151"/>
  <rect class="node" x="66" y="153" width="228" height="44" rx="7"/><text x="180" y="175">在同一事务中写入</text>
  <path class="line" d="M180 197V220"/>
  <rect class="node" x="48" y="222" width="264" height="44" rx="7"/><text x="180" y="244">最终仍有启用管理员？</text>
  <path class="line" d="M110 266V308"/><text x="91" y="288">否</text>
  <path class="line" d="M250 266V308"/><text x="269" y="288">是</text>
  <rect class="node failure" x="48" y="311" width="124" height="42" rx="7"/><text x="110" y="332">整体回滚</text>
  <rect class="node success" x="188" y="311" width="124" height="42" rx="7"/><text x="250" y="332">提交变更</text>
</svg>
