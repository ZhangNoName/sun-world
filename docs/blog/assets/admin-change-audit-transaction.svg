<svg xmlns="http://www.w3.org/2000/svg" width="360" height="354" viewBox="0 0 360 354" role="img" aria-labelledby="title desc">
  <title id="title">业务变更与审计记录共同提交</title>
  <desc id="desc">维护请求在同一数据库事务中写业务与审计，确认成功一同保存，提交前失败一同回滚，确认丢失时等待核对。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 15px; fill: #25364a; text-anchor: middle; dominant-baseline: middle; }
    .node { fill: #edf3fa; stroke: #8098b1; stroke-width: 1.3; }
    .group { fill: none; stroke: #8098b1; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .line { fill: none; stroke: #7087a0; stroke-width: 1.5; marker-end: url(#arrow); }
    .success { fill: #e3f3ed; stroke: #588674; }
    .failure { fill: #f9eceb; stroke: #ae7874; }
    @media (prefers-color-scheme: dark) { text { fill: #e3ebf4; } .node { fill: #26394b; stroke: #93abc2; } .group { stroke: #93abc2; } .line { stroke: #9db1c6; } .success { fill: #25463d; stroke: #84b49f; } .failure { fill: #503837; stroke: #cf9b96; } }
  </style>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="#8098b1"/></marker></defs>
  <rect class="node" x="76" y="8" width="208" height="42" rx="7"/><text x="180" y="29">维护请求</text>
  <path class="line" d="M180 50V82"/>
  <rect class="group" x="12" y="84" width="336" height="150" rx="9"/><text x="180" y="104">同一数据库事务</text>
  <rect class="node" x="32" y="126" width="132" height="42" rx="7"/><text x="98" y="147">业务变更</text>
  <rect class="node" x="196" y="126" width="132" height="42" rx="7"/><text x="262" y="147">审计记录</text>
  <path class="line" d="M98 168V178H180V187"/><path class="line" d="M262 168V178H180V187"/>
  <rect class="node" x="104" y="190" width="152" height="34" rx="7"/><text x="180" y="207">统一处理结果</text>
  <path class="line" d="M180 234V248H60V300"/><path class="line" d="M180 234V300"/><path class="line" d="M180 234V248H300V300"/>
  <rect class="node" x="14" y="264" width="92" height="24" rx="3" style="stroke:none"/><rect class="node" x="134" y="264" width="92" height="24" rx="3" style="stroke:none"/><rect class="node" x="254" y="264" width="92" height="24" rx="3" style="stroke:none"/>
  <text x="60" y="276">确认成功</text><text x="180" y="276">提交前失败</text><text x="300" y="276">确认丢失</text>
  <rect class="node success" x="6" y="303" width="108" height="42" rx="7"/><text x="60" y="324">一起保存</text>
  <rect class="node failure" x="126" y="303" width="108" height="42" rx="7"/><text x="180" y="324">一起回滚</text>
  <rect class="node" x="246" y="303" width="108" height="42" rx="7"/><text x="300" y="324">等待核对</text>
</svg>
