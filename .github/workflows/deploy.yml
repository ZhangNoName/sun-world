name: Deploy Sun World

'on':
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      mode:
        description: Deployment mode
        required: true
        default: build-and-deploy
        type: choice
        options:
          - build-and-deploy
          - build-only
          - deploy-existing
      target:
        description: Deployment target
        required: true
        default: all
        type: choice
        options:
          - all
          - web
          - api
      schema_mode:
        description: API schema migration scope
        required: true
        default: full
        type: choice
        options:
          - full
          - identity-20260829
      identity_schema_ack:
        description: Type 20260829_identity_schema for the reviewed identity cutover only
        required: false
        type: string
      identity_maintenance_ack:
        description: Type STOP_CURRENT_API_FOR_IDENTITY_CUTOVER to accept API downtime
        required: false
        type: string
      identity_timer_ack:
        description: Type AUTO_DEPLOY_TIMER_STOPPED_FOR_IDENTITY_CUTOVER after stopping and masking the timer
        required: false
        type: string
      image_tag:
        description: Existing local image tag for deploy-existing, usually a commit SHA
        required: false
        type: string

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-sun-world-pr-{0}', github.event.pull_request.number) || 'deploy-sun-world-production' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FRONTEND_IMAGE_NAME: sun-world-frontend
  API_IMAGE_NAME: sun-world-api
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  detect-changes:
    name: Detect changed deploy targets
    runs-on: ubuntu-latest
    outputs:
      web_changed: ${{ steps.detect.outputs.web_changed }}
      api_changed: ${{ steps.detect.outputs.api_changed }}
      any_changed: ${{ steps.detect.outputs.any_changed }}
      build_needed: ${{ steps.detect.outputs.build_needed }}
      deploy_needed: ${{ steps.detect.outputs.deploy_needed }}
      image_tag: ${{ steps.detect.outputs.image_tag }}
      schema_mode: ${{ steps.detect.outputs.schema_mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed deploy targets
        id: detect
        env:
          IDENTITY_CUTOVER_ALLOWED_SHA: ${{ vars.IDENTITY_CUTOVER_ALLOWED_SHA }}
          DISPATCH_IMAGE_TAG: ${{ inputs.image_tag }}
          IDENTITY_SCHEMA_ACK: ${{ inputs.identity_schema_ack }}
          IDENTITY_MAINTENANCE_ACK: ${{ inputs.identity_maintenance_ack }}
          IDENTITY_TIMER_ACK: ${{ inputs.identity_timer_ack }}
        shell: bash
        run: |
          set -euo pipefail

          web_changed=false
          api_changed=false
          build_needed=true
          deploy_needed=true
          image_tag=""
          schema_mode=full
          mode=automatic

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Manual production workflows must run from refs/heads/main." >&2
              exit 1
            fi
            mode="${{ inputs.mode }}"
            target="${{ inputs.target }}"
            image_tag="$DISPATCH_IMAGE_TAG"
            schema_mode="${{ inputs.schema_mode }}"

            case "$target" in
              all)
                web_changed=true
                api_changed=true
                ;;
              web)
                web_changed=true
                ;;
              api)
                api_changed=true
                ;;
              *)
                echo "Unsupported target: $target" >&2
                exit 1
                ;;
            esac

            case "$mode" in
              build-and-deploy)
                image_tag="${{ github.sha }}"
                ;;
              build-only)
                image_tag="${{ github.sha }}"
                deploy_needed=false
                ;;
              deploy-existing)
                build_needed=false
                if [ -z "$image_tag" ]; then
                  echo "image_tag is required when mode=deploy-existing." >&2
                  exit 1
                fi
                node scripts/identity-cutover-gate.mjs validate-image-tag "$image_tag"
                ;;
              *)
                echo "Unsupported mode: $mode" >&2
                exit 1
                ;;
            esac

            changed_files=".github/workflows/deploy.yml"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            before="${{ github.event.pull_request.base.sha }}"
            after="${{ github.event.pull_request.head.sha }}"
            image_tag="$after"
            build_needed=false
            deploy_needed=false
            changed_files="$(git diff --name-only "$before" "$after")"
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            image_tag="$after"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              if git rev-parse "$after^" >/dev/null 2>&1; then
                before="$after^"
                changed_files="$(git diff --name-only "$before" "$after")"
              else
                changed_files="$(git ls-tree -r --name-only "$after")"
              fi
            else
              changed_files="$(git diff --name-only "$before" "$after")"
            fi
          fi

          node scripts/identity-cutover-gate.mjs validate \
            "$GITHUB_EVENT_NAME" \
            "$GITHUB_REF" \
            "$GITHUB_SHA" \
            "$mode" \
            "$schema_mode" \
            "$api_changed" \
            "$deploy_needed" \
            "$image_tag" \
            "$IDENTITY_CUTOVER_ALLOWED_SHA" \
            "$IDENTITY_SCHEMA_ACK" \
            "$IDENTITY_MAINTENANCE_ACK" \
            "$IDENTITY_TIMER_ACK"

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              .github/workflows/deploy.yml)
                # Workflow-only changes should validate the pipeline shape but
                # should not redeploy production images.
                ;;
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig.json)
                web_changed=true
                api_changed=true
                ;;
              packages/contracts/*|packages/contracts/**)
                web_changed=true
                api_changed=true
                ;;
              Dockerfile|apps/web/*|apps/web/**|packages/ai-composer/*|packages/ai-composer/**|packages/ai-ui/*|packages/ai-ui/**|packages/base-ui/*|packages/base-ui/**|packages/editor/*|packages/editor/**|packages/icons/*|packages/icons/**|packages/ui/*|packages/ui/**)
                web_changed=true
                ;;
              deploy/frontend/Dockerfile.runtime|deploy/frontend/nginx.conf|deploy/frontend/verify_runtime_artifact.py)
                web_changed=true
                ;;
              deploy/backend/*.md|deploy/backend/**/*.md|deploy/frontend/*.md|deploy/frontend/**/*.md|scripts/*|scripts/**)
                # Deployment docs and local verification scripts do not enter
                # the production images.
                ;;
              apps/api/*|apps/api/**|deploy/backend/*|deploy/backend/**)
                api_changed=true
                ;;
            esac
          done <<< "$changed_files"

          stage_identity_cutover="$(
            node scripts/identity-cutover-gate.mjs should-stage-push \
              "$GITHUB_EVENT_NAME" \
              "$GITHUB_REF" \
              "$api_changed" \
              "$image_tag" \
              "$IDENTITY_CUTOVER_ALLOWED_SHA"
          )"
          if [ "$stage_identity_cutover" = "true" ]; then
            deploy_needed=false
            echo "Reviewed identity cutover SHA will be built without an automatic production deploy."
          fi

          if [ "$web_changed" = "true" ] || [ "$api_changed" = "true" ]; then
            any_changed=true
          else
            any_changed=false
          fi

          {
            echo "web_changed=$web_changed"
            echo "api_changed=$api_changed"
            echo "any_changed=$any_changed"
            echo "build_needed=$build_needed"
            echo "deploy_needed=$deploy_needed"
            echo "image_tag=$image_tag"
            echo "schema_mode=$schema_mode"
          } >> "$GITHUB_OUTPUT"

          printf 'Changed files:\n%s\n' "$changed_files"
          printf 'web_changed=%s api_changed=%s any_changed=%s build_needed=%s deploy_needed=%s image_tag=%s schema_mode=%s\n' \
            "$web_changed" "$api_changed" "$any_changed" "$build_needed" "$deploy_needed" "$image_tag" "$schema_mode"

  quality-common:
    name: Format and workflow checks
    needs: detect-changes
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'deploy-existing'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        env:
          PRETTIER_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: pnpm format:check

      - name: Check GitHub Actions protocols
        run: |
          pnpm check:github-actions:ci
          pnpm check:github-actions:deploy

      - name: Run Sun World CLI tests
        run: pnpm test:cli

      - name: Test frontend runtime artifact verifier
        run: python3 -m unittest discover -s tests/deploy -p 'test_frontend_runtime_artifact.py' -v

  quality-web:
    name: Frontend checks
    needs: detect-changes
    if: |
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'deploy-existing') &&
      needs.detect-changes.outputs.web_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      frontend_archive_sha256: ${{ steps.frontend_runtime.outputs.archive_sha256 }}
      frontend_archive_bytes: ${{ steps.frontend_runtime.outputs.archive_bytes }}
      frontend_file_count: ${{ steps.frontend_runtime.outputs.file_count }}
      frontend_uncompressed_bytes: ${{ steps.frontend_runtime.outputs.uncompressed_bytes }}
      frontend_manifest_sha256: ${{ steps.frontend_runtime.outputs.manifest_sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend package dependencies
        run: |
          pnpm build:icons
          pnpm build:ui
          pnpm -F @sun-world/ai-composer run build

      - name: Run frontend checks
        env:
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL || 'https://api.sunworld.site' }}
          VITE_TELEMETRY_ENDPOINT: ${{ vars.VITE_TELEMETRY_ENDPOINT || 'https://api.sunworld.site/telemetry/events' }}
        run: pnpm check:web

      - name: Run UI package tests
        run: pnpm test:ui

      - name: Run contracts tests
        run: pnpm test:contracts

      - name: Prepare frontend runtime artifact
        id: frontend_runtime
        if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.build_needed == 'true'
        env:
          IMAGE_TAG: ${{ needs.detect-changes.outputs.image_tag }}
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL || 'https://api.sunworld.site' }}
          VITE_TELEMETRY_ENDPOINT: ${{ vars.VITE_TELEMETRY_ENDPOINT || 'https://api.sunworld.site/telemetry/events' }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Frontend runtime artifact requires a commit SHA image tag." >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$IMAGE_TAG" ] || \
            ! [[ "$WORKFLOW_RUN_ID" =~ ^[1-9][0-9]*$ ]] || \
            ! [[ "$WORKFLOW_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "Frontend runtime artifact provenance is invalid." >&2
            exit 1
          fi
          test -f apps/web/dist/index.html
          test -f apps/web/dist/spa.html
          test -d apps/web/dist/assets
          unsupported_entry="$(find apps/web/dist -mindepth 1 ! -type f ! -type d -print -quit)"
          if [ -n "$unsupported_entry" ]; then
            echo "Frontend dist contains an unsupported entry: $unsupported_entry" >&2
            exit 1
          fi
          rm -rf frontend-runtime-artifact
          mkdir -p frontend-runtime-artifact

          archive="frontend-runtime-artifact/frontend-dist.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 \
            --numeric-owner --mode='u+rwX,go+rX,go-w' -C apps/web -cf - dist |
            gzip -n -9 > "$archive"
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          archive_bytes="$(stat -c '%s' "$archive")"
          if [ "$archive_bytes" -le 0 ] || [ "$archive_bytes" -gt 67108864 ]; then
            echo "Frontend archive must be between 1 byte and 64 MiB." >&2
            exit 1
          fi

          python3 - "$archive" frontend-runtime-artifact/manifest.json <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          archive_path = pathlib.Path(sys.argv[1])
          manifest_path = pathlib.Path(sys.argv[2])
          dist_root = pathlib.Path("apps/web/dist")
          files = []
          total_bytes = 0
          for path in sorted(dist_root.rglob("*")):
              if path.is_dir():
                  continue
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"Unsupported frontend dist entry: {path}")
              relative = path.relative_to(dist_root).as_posix()
              size = path.stat().st_size
              if size > 50 * 1024 * 1024:
                  raise SystemExit(f"Frontend dist file exceeds 50 MiB: {relative}")
              digest = hashlib.sha256()
              with path.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b""):
                      digest.update(chunk)
              files.append({"path": f"dist/{relative}", "size": size, "sha256": digest.hexdigest()})
              total_bytes += size

          if not files or len(files) > 5000 or total_bytes > 200 * 1024 * 1024:
              raise SystemExit("Frontend dist exceeds the runtime artifact limits")
          base_url = os.environ["VITE_BASE_URL"]
          telemetry_endpoint = os.environ["VITE_TELEMETRY_ENDPOINT"]
          if not base_url.startswith("https://") or not telemetry_endpoint.startswith("https://"):
              raise SystemExit("Production Vite endpoints must use HTTPS")

          archive_sha256 = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          manifest = {
              "schema_version": 1,
              "commit": os.environ["IMAGE_TAG"],
              "run_id": int(os.environ["WORKFLOW_RUN_ID"]),
              "run_attempt": int(os.environ["WORKFLOW_RUN_ATTEMPT"]),
              "build": {
                  "vite_base_url": base_url,
                  "vite_telemetry_endpoint": telemetry_endpoint,
              },
              "archive": {
                  "sha256": archive_sha256,
                  "bytes": archive_path.stat().st_size,
                  "file_count": len(files),
                  "uncompressed_bytes": total_bytes,
              },
              "files": files,
          }
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, separators=(",", ":"), sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          file_count="$(jq -er '.archive.file_count' frontend-runtime-artifact/manifest.json)"
          uncompressed_bytes="$(jq -er '.archive.uncompressed_bytes' frontend-runtime-artifact/manifest.json)"
          manifest_sha256="$(sha256sum frontend-runtime-artifact/manifest.json | awk '{print $1}')"
          {
            echo "archive_sha256=$archive_sha256"
            echo "archive_bytes=$archive_bytes"
            echo "file_count=$file_count"
            echo "uncompressed_bytes=$uncompressed_bytes"
            echo "manifest_sha256=$manifest_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload frontend runtime artifact
        if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.build_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-runtime-${{ needs.detect-changes.outputs.image_tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend-runtime-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  quality-api:
    name: API checks
    needs: detect-changes
    if: |
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'deploy-existing') &&
      needs.detect-changes.outputs.api_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./apps/api

      - name: Run API checks
        run: pnpm check:api

  build-web:
    name: Build frontend image on Lighthouse
    needs:
      - detect-changes
      - quality-common
      - quality-web
      - quality-api
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.web_changed == 'true' &&
      needs.detect-changes.outputs.build_needed == 'true' &&
      (needs.quality-common.result == 'success' || needs.quality-common.result == 'skipped') &&
      needs.quality-web.result == 'success' &&
      (needs.quality-api.result == 'success' || needs.quality-api.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deploy_image: ${{ steps.image-meta.outputs.deploy_image }}

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download frontend runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-runtime-${{ needs.detect-changes.outputs.image_tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend-runtime-artifact

      - name: Verify frontend runtime artifact
        env:
          IMAGE_TAG: ${{ needs.detect-changes.outputs.image_tag }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.quality-web.outputs.frontend_archive_sha256 }}
          EXPECTED_ARCHIVE_BYTES: ${{ needs.quality-web.outputs.frontend_archive_bytes }}
          EXPECTED_FILE_COUNT: ${{ needs.quality-web.outputs.frontend_file_count }}
          EXPECTED_UNCOMPRESSED_BYTES: ${{ needs.quality-web.outputs.frontend_uncompressed_bytes }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.quality-web.outputs.frontend_manifest_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          archive="frontend-runtime-artifact/frontend-dist.tar.gz"
          manifest="frontend-runtime-artifact/manifest.json"
          test -f "$archive"
          test -f "$manifest"
          if ! [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || \
            ! [[ "$WORKFLOW_RUN_ID" =~ ^[1-9][0-9]*$ ]] || \
            ! [[ "$WORKFLOW_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || \
            ! [[ "$EXPECTED_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]] || \
            ! [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || \
            ! [[ "$EXPECTED_ARCHIVE_BYTES" =~ ^[1-9][0-9]*$ ]] || \
            ! [[ "$EXPECTED_FILE_COUNT" =~ ^[1-9][0-9]*$ ]] || \
            ! [[ "$EXPECTED_UNCOMPRESSED_BYTES" =~ ^[1-9][0-9]*$ ]]; then
            echo "Frontend runtime artifact outputs are invalid." >&2
            exit 1
          fi
          [ "$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_ARCHIVE_SHA256" ]
          [ "$(stat -c '%s' "$archive")" = "$EXPECTED_ARCHIVE_BYTES" ]
          [ "$(sha256sum "$manifest" | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256" ]

          verify_root="$(mktemp -d "$RUNNER_TEMP/frontend-runtime-verify.XXXXXX")"
          verify_dir="$verify_root/output"
          trap 'rm -rf -- "$verify_root"' EXIT
          python3 deploy/frontend/verify_runtime_artifact.py \
            --archive "$archive" \
            --manifest "$manifest" \
            --output "$verify_dir" \
            --expected-commit "$IMAGE_TAG" \
            --expected-run-id "$WORKFLOW_RUN_ID" \
            --expected-run-attempt "$WORKFLOW_RUN_ATTEMPT" \
            --expected-sha256 "$EXPECTED_ARCHIVE_SHA256" \
            --expected-bytes "$EXPECTED_ARCHIVE_BYTES" \
            --expected-file-count "$EXPECTED_FILE_COUNT" \
            --expected-uncompressed-bytes "$EXPECTED_UNCOMPRESSED_BYTES"

      - name: Prepare frontend deploy metadata
        id: image-meta
        shell: bash
        run: |
          set -euo pipefail
          deploy_image="${FRONTEND_IMAGE_NAME}:${{ needs.detect-changes.outputs.image_tag }}"
          mkdir -p deploy-artifacts
          printf '%s\n' "${{ needs.detect-changes.outputs.image_tag }}" > deploy-artifacts/commit.txt
          printf '%s\n' "$deploy_image" > deploy-artifacts/image.txt
          printf '%s\n' "${{ needs.quality-web.outputs.frontend_archive_sha256 }}" > deploy-artifacts/dist-archive.sha256
          printf '%s\n' "${{ needs.quality-web.outputs.frontend_archive_bytes }}" > deploy-artifacts/dist-archive.bytes
          printf '%s\n' "${{ needs.quality-web.outputs.frontend_manifest_sha256 }}" > deploy-artifacts/dist-manifest.sha256
          echo "deploy_image=$deploy_image" >> "$GITHUB_OUTPUT"

      - name: Upload frontend deployment metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-deploy-metadata-${{ needs.detect-changes.outputs.image_tag }}
          path: deploy-artifacts
          retention-days: 30

      - name: Prepare SSH
        env:
          LIGHTHOUSE_HOST: ${{ vars.LIGHTHOUSE_HOST }}
          LIGHTHOUSE_PORT: ${{ vars.LIGHTHOUSE_PORT || '22' }}
          LIGHTHOUSE_SSH_KEY: ${{ secrets.LIGHTHOUSE_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$LIGHTHOUSE_HOST" != "81.70.43.189" ] || [ "$LIGHTHOUSE_PORT" != "22" ]; then
            echo "Lighthouse host or port does not match the pinned deployment host." >&2
            exit 1
          fi
          if [ "$(wc -l < deploy/lighthouse_known_hosts)" -ne 1 ] || \
            ! ssh-keygen -F "$LIGHTHOUSE_HOST" -f deploy/lighthouse_known_hosts >/dev/null; then
            echo "Pinned Lighthouse SSH host key is missing or malformed." >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$LIGHTHOUSE_SSH_KEY" > ~/.ssh/sun_world_deploy_key
          chmod 600 ~/.ssh/sun_world_deploy_key
          install -m 600 deploy/lighthouse_known_hosts ~/.ssh/known_hosts

      - name: Build frontend image on Lighthouse
        env:
          FRONTEND_IMAGE: ${{ steps.image-meta.outputs.deploy_image }}
          IMAGE_TAG: ${{ needs.detect-changes.outputs.image_tag }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.quality-web.outputs.frontend_archive_sha256 }}
          EXPECTED_ARCHIVE_BYTES: ${{ needs.quality-web.outputs.frontend_archive_bytes }}
          EXPECTED_FILE_COUNT: ${{ needs.quality-web.outputs.frontend_file_count }}
          EXPECTED_UNCOMPRESSED_BYTES: ${{ needs.quality-web.outputs.frontend_uncompressed_bytes }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.quality-web.outputs.frontend_manifest_sha256 }}
          LIGHTHOUSE_HOST: ${{ vars.LIGHTHOUSE_HOST }}
          LIGHTHOUSE_USER: ${{ vars.LIGHTHOUSE_USER }}
          LIGHTHOUSE_PORT: ${{ vars.LIGHTHOUSE_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || \
            ! [[ "$WORKFLOW_RUN_ID" =~ ^[1-9][0-9]*$ ]] || \
            ! [[ "$WORKFLOW_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || \
            ! [[ "$LIGHTHOUSE_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo "Frontend image packaging metadata is invalid." >&2
            exit 1
          fi
          archive="frontend-runtime-artifact/frontend-dist.tar.gz"
          manifest="frontend-runtime-artifact/manifest.json"
          remote_dir="/home/lighthouse/.cache/sun-world-deploy"
          remote_prefix="$remote_dir/frontend-runtime-$IMAGE_TAG-$WORKFLOW_RUN_ID-$WORKFLOW_RUN_ATTEMPT"
          remote_archive_part="$remote_prefix.tar.gz.part"
          remote_manifest_part="$remote_prefix.manifest.json.part"

          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -i ~/.ssh/sun_world_deploy_key -p "$LIGHTHOUSE_PORT" \
            "$LIGHTHOUSE_USER@$LIGHTHOUSE_HOST" \
            'install -d -m 700 /home/lighthouse/.cache/sun-world-deploy'

          upload_complete=false
          for upload_attempt in 1 2 3; do
            if scp -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              -i ~/.ssh/sun_world_deploy_key -P "$LIGHTHOUSE_PORT" \
              "$archive" "$LIGHTHOUSE_USER@$LIGHTHOUSE_HOST:$remote_archive_part" && \
              scp -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              -i ~/.ssh/sun_world_deploy_key -P "$LIGHTHOUSE_PORT" \
              "$manifest" "$LIGHTHOUSE_USER@$LIGHTHOUSE_HOST:$remote_manifest_part"; then
              upload_complete=true
              break
            fi
            echo "Frontend artifact upload attempt $upload_attempt failed." >&2
            sleep 5
          done
          if [ "$upload_complete" != "true" ]; then
            echo "Frontend artifact upload failed after three attempts." >&2
            exit 1
          fi

          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -i ~/.ssh/sun_world_deploy_key -p "$LIGHTHOUSE_PORT" \
            "$LIGHTHOUSE_USER@$LIGHTHOUSE_HOST" 'bash -s' -- \
            "$IMAGE_TAG" "$FRONTEND_IMAGE" "$WORKFLOW_RUN_ID" "$WORKFLOW_RUN_ATTEMPT" \
            "$remote_archive_part" "$remote_manifest_part" "$EXPECTED_ARCHIVE_SHA256" \
            "$EXPECTED_ARCHIVE_BYTES" "$EXPECTED_FILE_COUNT" "$EXPECTED_UNCOMPRESSED_BYTES" \
            "$EXPECTED_MANIFEST_SHA256" <<'REMOTE'
          set -euo pipefail
          umask 077
          IMAGE_TAG="$1"
          FRONTEND_IMAGE="$2"
          WORKFLOW_RUN_ID="$3"
          WORKFLOW_RUN_ATTEMPT="$4"
          REMOTE_ARCHIVE_PART="$5"
          REMOTE_MANIFEST_PART="$6"
          EXPECTED_ARCHIVE_SHA256="$7"
          EXPECTED_ARCHIVE_BYTES="$8"
          EXPECTED_FILE_COUNT="$9"
          EXPECTED_UNCOMPRESSED_BYTES="${10}"
          EXPECTED_MANIFEST_SHA256="${11}"
          REPO_DIR="/home/lighthouse/blog/sun-world"
          LOCK_FILE="/tmp/sun-world-docker-build.lock"
          CACHE_DIR="/home/lighthouse/.cache/sun-world-deploy"
          STAGING_ROOT="$CACHE_DIR/staging"
          EXPECTED_PREFIX="$CACHE_DIR/frontend-runtime-$IMAGE_TAG-$WORKFLOW_RUN_ID-$WORKFLOW_RUN_ATTEMPT"
          EXPECTED_ARCHIVE_PART="$EXPECTED_PREFIX.tar.gz.part"
          EXPECTED_MANIFEST_PART="$EXPECTED_PREFIX.manifest.json.part"
          EXPECTED_ARCHIVE="$EXPECTED_PREFIX.tar.gz"
          EXPECTED_MANIFEST="$EXPECTED_PREFIX.manifest.json"
          WORK_ROOT=""
          WORK_DIR=""

          if ! [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || \
            [ "$FRONTEND_IMAGE" != "sun-world-frontend:$IMAGE_TAG" ] || \
            ! [[ "$WORKFLOW_RUN_ID" =~ ^[1-9][0-9]*$ ]] || \
            ! [[ "$WORKFLOW_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || \
            ! [[ "$EXPECTED_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]] || \
            ! [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || \
            ! [[ "$EXPECTED_ARCHIVE_BYTES" =~ ^[1-9][0-9]*$ ]] || \
            ! [[ "$EXPECTED_FILE_COUNT" =~ ^[1-9][0-9]*$ ]] || \
            ! [[ "$EXPECTED_UNCOMPRESSED_BYTES" =~ ^[1-9][0-9]*$ ]] || \
            [ "$EXPECTED_ARCHIVE_BYTES" -gt 67108864 ] || \
            [ "$EXPECTED_FILE_COUNT" -gt 5000 ] || \
            [ "$EXPECTED_UNCOMPRESSED_BYTES" -gt 209715200 ] || \
            [ "$REMOTE_ARCHIVE_PART" != "$EXPECTED_ARCHIVE_PART" ] || \
            [ "$REMOTE_MANIFEST_PART" != "$EXPECTED_MANIFEST_PART" ]; then
            echo "Frontend runtime artifact metadata is invalid." >&2
            exit 1
          fi

          cleanup_frontend_artifact() {
            status="$?"
            set +e
            if [ -n "$WORK_ROOT" ] && [[ "$WORK_ROOT" == "$STAGING_ROOT"/frontend-"$IMAGE_TAG"-* ]]; then
              rm -rf -- "$WORK_ROOT"
            fi
            rm -f -- "$EXPECTED_ARCHIVE_PART" "$EXPECTED_MANIFEST_PART" \
              "$EXPECTED_ARCHIVE" "$EXPECTED_MANIFEST"
            exit "$status"
          }
          trap cleanup_frontend_artifact EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          exec 9>"$LOCK_FILE"
          flock 9

          test -f "$EXPECTED_ARCHIVE_PART"
          test ! -L "$EXPECTED_ARCHIVE_PART"
          test -f "$EXPECTED_MANIFEST_PART"
          test ! -L "$EXPECTED_MANIFEST_PART"
          [ "$(stat -c '%s' "$EXPECTED_ARCHIVE_PART")" = "$EXPECTED_ARCHIVE_BYTES" ]
          [ "$(sha256sum "$EXPECTED_ARCHIVE_PART" | awk '{print $1}')" = "$EXPECTED_ARCHIVE_SHA256" ]
          [ "$(sha256sum "$EXPECTED_MANIFEST_PART" | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256" ]
          mv -- "$EXPECTED_ARCHIVE_PART" "$EXPECTED_ARCHIVE"
          mv -- "$EXPECTED_MANIFEST_PART" "$EXPECTED_MANIFEST"

          available_kb="$(df -Pk "$CACHE_DIR" | awk 'NR == 2 { print $4 }')"
          if [ "$available_kb" -lt 2097152 ]; then
            echo "Less than 2 GiB is free; pruning only unused Docker data before packaging." >&2
            sudo docker image prune -f
            sudo docker builder prune -f --filter until=168h
            available_kb="$(df -Pk "$CACHE_DIR" | awk 'NR == 2 { print $4 }')"
          fi
          if [ "$available_kb" -lt 1048576 ]; then
            echo "Less than 1 GiB remains after safe cleanup; refusing to package the frontend image." >&2
            exit 1
          fi

          cd "$REPO_DIR"
          if ! git diff --quiet -- || ! git diff --cached --quiet -- || \
            [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Server repository is not completely clean; refusing to build frontend image." >&2
            exit 1
          fi

          git fetch --prune origin main
          git checkout main
          git pull --ff-only origin main

          current_sha="$(git rev-parse HEAD)"
          if [ "$current_sha" != "$IMAGE_TAG" ]; then
            echo "Server main is at $current_sha, expected $IMAGE_TAG." >&2
            exit 1
          fi
          if ! git diff --quiet -- || ! git diff --cached --quiet -- || \
            [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Server repository changed while preparing the frontend build." >&2
            exit 1
          fi
          for release_file in \
            deploy/frontend/Dockerfile.runtime \
            deploy/frontend/nginx.conf \
            deploy/frontend/verify_runtime_artifact.py; do
            test -f "$release_file"
            if ! git cat-file blob "$IMAGE_TAG:$release_file" | cmp -s - "$release_file"; then
              echo "Server deployment file does not match $IMAGE_TAG: $release_file" >&2
              exit 1
            fi
          done

          install -d -m 700 "$STAGING_ROOT"
          WORK_ROOT="$(mktemp -d "$STAGING_ROOT/frontend-$IMAGE_TAG-$WORKFLOW_RUN_ID-$WORKFLOW_RUN_ATTEMPT.XXXXXX")"
          WORK_DIR="$WORK_ROOT/context"
          python3 deploy/frontend/verify_runtime_artifact.py \
            --archive "$EXPECTED_ARCHIVE" \
            --manifest "$EXPECTED_MANIFEST" \
            --output "$WORK_DIR" \
            --expected-commit "$IMAGE_TAG" \
            --expected-run-id "$WORKFLOW_RUN_ID" \
            --expected-run-attempt "$WORKFLOW_RUN_ATTEMPT" \
            --expected-sha256 "$EXPECTED_ARCHIVE_SHA256" \
            --expected-bytes "$EXPECTED_ARCHIVE_BYTES" \
            --expected-file-count "$EXPECTED_FILE_COUNT" \
            --expected-uncompressed-bytes "$EXPECTED_UNCOMPRESSED_BYTES"
          test -f "$WORK_DIR/dist/index.html"
          test -f "$WORK_DIR/dist/spa.html"
          test -d "$WORK_DIR/dist/assets"
          cp deploy/frontend/nginx.conf "$WORK_DIR/nginx.conf"
          sudo docker image inspect nginx:alpine >/dev/null
          sudo docker build --pull=false --network=none --progress=plain \
            --label "org.opencontainers.image.revision=$IMAGE_TAG" \
            --label "site.sunworld.frontend.dist-archive-sha256=$EXPECTED_ARCHIVE_SHA256" \
            -t "$FRONTEND_IMAGE" \
            -f deploy/frontend/Dockerfile.runtime "$WORK_DIR"
          sudo docker image inspect "$FRONTEND_IMAGE" >/dev/null
          [ "$(sudo docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$FRONTEND_IMAGE")" = "$IMAGE_TAG" ]
          sudo docker image prune -f
          REMOTE

  build-api:
    name: Build API image on Lighthouse
    needs:
      - detect-changes
      - quality-common
      - quality-web
      - quality-api
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.api_changed == 'true' &&
      needs.detect-changes.outputs.build_needed == 'true' &&
      (needs.quality-common.result == 'success' || needs.quality-common.result == 'skipped') &&
      (needs.quality-web.result == 'success' || needs.quality-web.result == 'skipped') &&
      needs.quality-api.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deploy_image: ${{ steps.image-meta.outputs.deploy_image }}

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare API deploy artifacts
        id: image-meta
        shell: bash
        run: |
          set -euo pipefail
          deploy_image="${API_IMAGE_NAME}:${{ needs.detect-changes.outputs.image_tag }}"
          mkdir -p api-deploy-artifacts
          printf '%s\n' "${{ needs.detect-changes.outputs.image_tag }}" > api-deploy-artifacts/commit.txt
          printf '%s\n' "$deploy_image" > api-deploy-artifacts/image.txt
          echo "deploy_image=$deploy_image" >> "$GITHUB_OUTPUT"

      - name: Upload API deployment metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-deploy-metadata-${{ needs.detect-changes.outputs.image_tag }}
          path: api-deploy-artifacts
          retention-days: 30

      - name: Prepare SSH
        env:
          LIGHTHOUSE_HOST: ${{ vars.LIGHTHOUSE_HOST }}
          LIGHTHOUSE_PORT: ${{ vars.LIGHTHOUSE_PORT || '22' }}
          LIGHTHOUSE_SSH_KEY: ${{ secrets.LIGHTHOUSE_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$LIGHTHOUSE_HOST" != "81.70.43.189" ] || [ "$LIGHTHOUSE_PORT" != "22" ]; then
            echo "Lighthouse host or port does not match the pinned deployment host." >&2
            exit 1
          fi
          if [ "$(wc -l < deploy/lighthouse_known_hosts)" -ne 1 ] || \
            ! ssh-keygen -F "$LIGHTHOUSE_HOST" -f deploy/lighthouse_known_hosts >/dev/null; then
            echo "Pinned Lighthouse SSH host key is missing or malformed." >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$LIGHTHOUSE_SSH_KEY" > ~/.ssh/sun_world_deploy_key
          chmod 600 ~/.ssh/sun_world_deploy_key
          install -m 600 deploy/lighthouse_known_hosts ~/.ssh/known_hosts

      - name: Build API image on Lighthouse
        env:
          API_IMAGE: ${{ steps.image-meta.outputs.deploy_image }}
          IMAGE_TAG: ${{ needs.detect-changes.outputs.image_tag }}
          LIGHTHOUSE_HOST: ${{ vars.LIGHTHOUSE_HOST }}
          LIGHTHOUSE_USER: ${{ vars.LIGHTHOUSE_USER }}
          LIGHTHOUSE_PORT: ${{ vars.LIGHTHOUSE_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -i ~/.ssh/sun_world_deploy_key -p "$LIGHTHOUSE_PORT" \
            "$LIGHTHOUSE_USER@$LIGHTHOUSE_HOST" 'bash -s' -- \
            "$IMAGE_TAG" "$API_IMAGE" <<'REMOTE'
          set -euo pipefail
          IMAGE_TAG="$1"
          API_IMAGE="$2"
          REPO_DIR="/home/lighthouse/blog/sun-world"
          LOCK_FILE="/tmp/sun-world-docker-build.lock"

          exec 9>"$LOCK_FILE"
          flock 9

          cd "$REPO_DIR"
          if ! git diff --quiet -- || ! git diff --cached --quiet -- || \
            [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Server repository is not completely clean; refusing to build API image." >&2
            exit 1
          fi

          git fetch --prune origin main
          git checkout main
          git pull --ff-only origin main

          current_sha="$(git rev-parse HEAD)"
          if [ "$current_sha" != "$IMAGE_TAG" ]; then
            echo "Server main is at $current_sha, expected $IMAGE_TAG." >&2
            exit 1
          fi
          if ! git diff --quiet -- || ! git diff --cached --quiet -- || \
            [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Server repository changed while preparing the API build." >&2
            exit 1
          fi

          sudo docker build --progress=plain -t "$API_IMAGE" -f apps/api/Dockerfile apps/api
          sudo docker image prune -f
          REMOTE

  deploy:
    name: Deploy changed services on Lighthouse
    needs:
      - detect-changes
      - build-web
      - build-api
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.any_changed == 'true' &&
      needs.detect-changes.outputs.deploy_needed == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy-existing') ||
        (
          (needs.detect-changes.outputs.web_changed != 'true' || needs.build-web.result == 'success') &&
          (needs.detect-changes.outputs.api_changed != 'true' || needs.build-api.result == 'success')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          LIGHTHOUSE_HOST: ${{ vars.LIGHTHOUSE_HOST }}
          LIGHTHOUSE_PORT: ${{ vars.LIGHTHOUSE_PORT || '22' }}
          LIGHTHOUSE_SSH_KEY: ${{ secrets.LIGHTHOUSE_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$LIGHTHOUSE_HOST" != "81.70.43.189" ] || [ "$LIGHTHOUSE_PORT" != "22" ]; then
            echo "Lighthouse host or port does not match the pinned deployment host." >&2
            exit 1
          fi
          if [ "$(wc -l < deploy/lighthouse_known_hosts)" -ne 1 ] || \
            ! ssh-keygen -F "$LIGHTHOUSE_HOST" -f deploy/lighthouse_known_hosts >/dev/null; then
            echo "Pinned Lighthouse SSH host key is missing or malformed." >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$LIGHTHOUSE_SSH_KEY" > ~/.ssh/sun_world_deploy_key
          chmod 600 ~/.ssh/sun_world_deploy_key
          install -m 600 deploy/lighthouse_known_hosts ~/.ssh/known_hosts

      - name: Sync AI secrets on Lighthouse
        if: needs.detect-changes.outputs.api_changed == 'true'
        env:
          AI_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.AI_CREDENTIAL_ENCRYPTION_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LIGHTHOUSE_HOST: ${{ vars.LIGHTHOUSE_HOST }}
          LIGHTHOUSE_USER: ${{ vars.LIGHTHOUSE_USER }}
          LIGHTHOUSE_PORT: ${{ vars.LIGHTHOUSE_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$AI_CREDENTIAL_ENCRYPTION_KEY" ] || [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "Required AI deployment secrets are not configured." >&2
            exit 1
          fi
          printf '%s\0%s\0' "$AI_CREDENTIAL_ENCRYPTION_KEY" "$DEEPSEEK_API_KEY" |
            ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              -i ~/.ssh/sun_world_deploy_key -p "$LIGHTHOUSE_PORT" \
              "$LIGHTHOUSE_USER@$LIGHTHOUSE_HOST" \
              'python3 /home/lighthouse/blog/sun-world/deploy/backend/sync_ai_secrets.py /home/lighthouse/.config/blog_end/auth.env'

      - name: Deploy local images on Lighthouse
        env:
          WEB_CHANGED: ${{ needs.detect-changes.outputs.web_changed }}
          API_CHANGED: ${{ needs.detect-changes.outputs.api_changed }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE_NAME }}:${{ needs.detect-changes.outputs.image_tag }}
          API_IMAGE: ${{ env.API_IMAGE_NAME }}:${{ needs.detect-changes.outputs.image_tag }}
          IMAGE_TAG: ${{ needs.detect-changes.outputs.image_tag }}
          SCHEMA_MODE: ${{ needs.detect-changes.outputs.schema_mode }}
          DEPLOYMENT_MODE: ${{ inputs.mode }}
          IDENTITY_CUTOVER_ALLOWED_SHA: ${{ vars.IDENTITY_CUTOVER_ALLOWED_SHA }}
          IDENTITY_SCHEMA_ACK: ${{ inputs.identity_schema_ack }}
          IDENTITY_MAINTENANCE_ACK: ${{ inputs.identity_maintenance_ack }}
          IDENTITY_TIMER_ACK: ${{ inputs.identity_timer_ack }}
          LIGHTHOUSE_HOST: ${{ vars.LIGHTHOUSE_HOST }}
          LIGHTHOUSE_USER: ${{ vars.LIGHTHOUSE_USER }}
          LIGHTHOUSE_PORT: ${{ vars.LIGHTHOUSE_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SCHEMA_MODE" in
            full)
              IDENTITY_CUTOVER_ALLOWED_SHA=""
              IDENTITY_SCHEMA_ACK=""
              IDENTITY_MAINTENANCE_ACK=""
              IDENTITY_TIMER_ACK=""
              ;;
            identity-20260829)
              if [ "$DEPLOYMENT_MODE" != "deploy-existing" ] || \
                ! [[ "$IDENTITY_CUTOVER_ALLOWED_SHA" =~ ^[0-9a-f]{40}$ ]] || \
                [ "$IDENTITY_CUTOVER_ALLOWED_SHA" != "$IMAGE_TAG" ] || \
                [ "$IDENTITY_SCHEMA_ACK" != "20260829_identity_schema" ] || \
                [ "$IDENTITY_MAINTENANCE_ACK" != "STOP_CURRENT_API_FOR_IDENTITY_CUTOVER" ] || \
                [ "$IDENTITY_TIMER_ACK" != "AUTO_DEPLOY_TIMER_STOPPED_FOR_IDENTITY_CUTOVER" ]; then
                echo "Scoped identity authorization changed after detect; refusing SSH." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported schema mode before SSH." >&2
              exit 1
              ;;
          esac
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -i ~/.ssh/sun_world_deploy_key -p "$LIGHTHOUSE_PORT" \
            "$LIGHTHOUSE_USER@$LIGHTHOUSE_HOST" 'bash -s' -- \
            "$WEB_CHANGED" "$API_CHANGED" "$FRONTEND_IMAGE" "$API_IMAGE" "$SCHEMA_MODE" \
            "$IMAGE_TAG" "$IDENTITY_CUTOVER_ALLOWED_SHA" "$IDENTITY_SCHEMA_ACK" \
            "$IDENTITY_MAINTENANCE_ACK" "$IDENTITY_TIMER_ACK" "$DEPLOYMENT_MODE" <<'REMOTE'
          set -euo pipefail
          WEB_CHANGED="$1"
          API_CHANGED="$2"
          FRONTEND_IMAGE="$3"
          API_IMAGE="$4"
          SCHEMA_MODE="$5"
          IMAGE_TAG="$6"
          IDENTITY_CUTOVER_ALLOWED_SHA="$7"
          IDENTITY_SCHEMA_ACK="$8"
          IDENTITY_MAINTENANCE_ACK="$9"
          IDENTITY_TIMER_ACK="${10}"
          DEPLOYMENT_MODE="${11}"
          LOCK_FILE="/tmp/sun-world-docker-build.lock"

          exec 9>"$LOCK_FILE"
          flock 9

          IDENTITY_MAINTENANCE_ACTIVE=false
          IDENTITY_FRONTEND_ROLLBACK_ACTIVE=false
          PREVIOUS_API_CONTAINER_ID=""
          PREVIOUS_API_IMAGE=""
          LEGACY_FRONTEND_CONTAINER_ID=""
          LEGACY_FRONTEND_IMAGE=""

          restore_identity_api() {
            set +e
            echo "Identity cutover failed; restoring the previous API container." >&2
            if ! sudo docker container inspect sun-world-api-identity-backup >/dev/null 2>&1; then
              echo "Identity API rollback container is missing." >&2
              return 1
            fi
            backup_id="$(sudo docker inspect --format '{{.Id}}' sun-world-api-identity-backup)"
            backup_image="$(sudo docker inspect --format '{{.Config.Image}}' sun-world-api-identity-backup)"
            if [ "$backup_id" != "$PREVIOUS_API_CONTAINER_ID" ] || [ "$backup_image" != "$PREVIOUS_API_IMAGE" ]; then
              echo "Identity API rollback container no longer matches the recorded container." >&2
              return 1
            fi
            sudo docker rm -f sun-world-api-candidate >/dev/null 2>&1 || true
            sudo docker rm -f sun-world-api >/dev/null 2>&1 || true
            sudo systemctl stop blog-api.service >/dev/null 2>&1 || true
            sudo systemctl disable blog-api.service >/dev/null 2>&1 || true
            sudo docker rename sun-world-api-identity-backup sun-world-api
            sudo docker start sun-world-api >/dev/null
            api_restored=false
            for attempt in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then
                api_restored=true
                break
              fi
              sleep 2
            done
            if [ "$api_restored" != "true" ]; then
              echo "Previous API container was restarted but did not pass local health." >&2
              return 1
            fi
          }

          identity_exit_trap() {
            status="$?"
            if [ "$status" -ne 0 ] && [ "$IDENTITY_MAINTENANCE_ACTIVE" = "true" ]; then
              restore_identity_api
            elif [ "$status" -ne 0 ] && sudo docker container inspect sun-world-api-identity-backup >/dev/null 2>&1; then
              # Cover a signal delivered after rename succeeds but before the
              # next shell assignment marks recovery active.
              restore_identity_api
            fi
            exit "$status"
          }

          restore_identity_frontend() {
            set +e
            echo "Identity frontend cutover failed; restoring the previous frontend container." >&2
            if ! sudo docker container inspect my-frontend-identity-backup >/dev/null 2>&1; then
              echo "Identity frontend rollback container is missing." >&2
              return 1
            fi
            backup_id="$(sudo docker inspect --format '{{.Id}}' my-frontend-identity-backup)"
            backup_image="$(sudo docker inspect --format '{{.Config.Image}}' my-frontend-identity-backup)"
            if [ "$backup_id" != "$LEGACY_FRONTEND_CONTAINER_ID" ] || [ "$backup_image" != "$LEGACY_FRONTEND_IMAGE" ]; then
              echo "Identity frontend rollback container no longer matches the recorded container." >&2
              return 1
            fi
            sudo docker rm -f my-frontend >/dev/null 2>&1 || true
            sudo docker rename my-frontend-identity-backup my-frontend
            sudo docker start my-frontend >/dev/null
            frontend_restored=false
            for attempt in $(seq 1 20); do
              if curl -fsSI http://127.0.0.1:8081 >/dev/null; then
                frontend_restored=true
                break
              fi
              sleep 2
            done
            if [ "$frontend_restored" != "true" ]; then
              echo "Previous frontend container was restarted but did not pass local health." >&2
              return 1
            fi
          }

          identity_frontend_exit_trap() {
            status="$?"
            if [ "$status" -ne 0 ] && [ "$IDENTITY_FRONTEND_ROLLBACK_ACTIVE" = "true" ]; then
              restore_identity_frontend
            elif [ "$status" -ne 0 ] && sudo docker container inspect my-frontend-identity-backup >/dev/null 2>&1; then
              # Cover a signal delivered in the rename/activation boundary.
              restore_identity_frontend
            fi
            exit "$status"
          }

          check_qq_only_auth_methods() {
            python3 -c 'import json, sys; payload = json.load(sys.stdin); methods = payload.get("data", []) if isinstance(payload, dict) else []; oauth = [item for item in methods if isinstance(item, dict) and item.get("id") in {"google", "qq", "wechat"}]; actual = {item.get("id"): item.get("enabled") for item in oauth}; expected = {"google": False, "qq": True, "wechat": False}; valid = len(oauth) == len(expected) and all(actual.get(provider) is enabled for provider, enabled in expected.items()); raise SystemExit(0 if valid else 1)' 2>/dev/null
          }

          API_MOUNTS=(
            -v /home/lighthouse/.config/blog_end:/home/lighthouse/.config/blog_end:ro
            -v /data/blog:/data/blog
          )
          if [ -d /home/lighthouse/blog/blog_end/src/conf ]; then
            API_MOUNTS+=(
              -v /home/lighthouse/blog/blog_end/src/conf:/app/src/conf:ro
            )
          fi

          case "$SCHEMA_MODE" in
            full)
              ;;
            identity-20260829)
              if [ "$DEPLOYMENT_MODE" != "deploy-existing" ]; then
                echo "Scoped identity migration requires mode=deploy-existing." >&2
                exit 1
              fi
              if [ "$API_CHANGED" != "true" ]; then
                echo "Scoped identity migration requires an API deployment." >&2
                exit 1
              fi
              if ! [[ "$IDENTITY_CUTOVER_ALLOWED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Scoped identity migration requires a reviewed 40-character lowercase SHA." >&2
                exit 1
              fi
              if [ "$IDENTITY_CUTOVER_ALLOWED_SHA" != "$IMAGE_TAG" ]; then
                echo "Scoped identity migration is not authorized for this image tag." >&2
                exit 1
              fi
              server_checkout_sha="$(git -C /home/lighthouse/blog/sun-world rev-parse HEAD)"
              if [ "$server_checkout_sha" != "$IMAGE_TAG" ]; then
                echo "Scoped identity migration requires the server checkout to match the reviewed image tag." >&2
                exit 1
              fi
              if ! git -C /home/lighthouse/blog/sun-world diff --quiet -- || \
                ! git -C /home/lighthouse/blog/sun-world diff --cached --quiet -- || \
                [ -n "$(git -C /home/lighthouse/blog/sun-world status --porcelain --untracked-files=all)" ]; then
                echo "Scoped identity migration requires a completely clean server checkout." >&2
                exit 1
              fi
              if [ "$API_IMAGE" != "sun-world-api:$IMAGE_TAG" ]; then
                echo "Scoped identity migration requires the API image bound to the reviewed tag." >&2
                exit 1
              fi
              if [ "$IDENTITY_SCHEMA_ACK" != "20260829_identity_schema" ]; then
                echo "Scoped identity migration acknowledgement is missing or invalid." >&2
                exit 1
              fi
              if [ "$IDENTITY_MAINTENANCE_ACK" != "STOP_CURRENT_API_FOR_IDENTITY_CUTOVER" ]; then
                echo "Scoped identity maintenance acknowledgement is missing or invalid." >&2
                exit 1
              fi
              if [ "$IDENTITY_TIMER_ACK" != "AUTO_DEPLOY_TIMER_STOPPED_FOR_IDENTITY_CUTOVER" ]; then
                echo "Scoped identity timer acknowledgement is missing or invalid." >&2
                exit 1
              fi
              timer_enabled_state="$(sudo systemctl is-enabled sun-world-auto-deploy.timer 2>/dev/null || true)"
              if sudo systemctl is-active --quiet sun-world-auto-deploy.timer || sudo systemctl is-active --quiet sun-world-auto-deploy.service || { [ "$timer_enabled_state" != "masked" ] && [ "$timer_enabled_state" != "masked-runtime" ]; }; then
                echo "Scoped identity cutover requires the frontend auto-deploy timer to be stopped and masked, with its service inactive." >&2
                exit 1
              fi
              callback_snippet_meta="$(sudo stat -c '%U:%G:%a' /etc/nginx/snippets/sun-world-oauth-callback-no-log.conf 2>/dev/null || true)"
              if [ "$callback_snippet_meta" != "root:root:644" ]; then
                echo "Scoped identity cutover requires the fixed callback-log snippet to be root-owned and mode 0644." >&2
                exit 1
              fi
              sudo nginx -T 2>&1 |
                python3 /home/lighthouse/blog/sun-world/scripts/check-oauth-callback-log-safety.py --nginx-dump
              sudo docker image inspect "$API_IMAGE" >/dev/null
              sudo docker run --rm --network host \
                -e BLOG_RUNTIME_ENV=production \
                "${API_MOUNTS[@]}" \
                "$API_IMAGE" /bin/sh -lc 'set -euo pipefail; set -a; . /home/lighthouse/.config/blog_end/auth.env; set +a; python -m src.modules.identity.redis_capability_preflight; python -m src.database.mysql.identity_schema_migration --mode plan; python -m src.modules.identity.qq_outbound_preflight'
              if [ "$WEB_CHANGED" = "true" ]; then
                sudo docker image inspect "$FRONTEND_IMAGE" >/dev/null
                if sudo docker container inspect my-frontend-identity-backup >/dev/null 2>&1; then
                  echo "Scoped identity cutover found a stale frontend rollback container." >&2
                  exit 1
                fi
                if ! sudo docker container inspect my-frontend >/dev/null 2>&1; then
                  echo "Scoped identity cutover requires the current frontend container." >&2
                  exit 1
                fi
                if [ "$(sudo docker inspect --format '{{.State.Running}}' my-frontend)" != "true" ]; then
                  echo "Scoped identity cutover requires the current frontend container to be running." >&2
                  exit 1
                fi
                LEGACY_FRONTEND_CONTAINER_ID="$(sudo docker inspect --format '{{.Id}}' my-frontend)"
                LEGACY_FRONTEND_IMAGE="$(sudo docker inspect --format '{{.Config.Image}}' my-frontend)"
              fi
              if sudo docker container inspect sun-world-api-identity-backup >/dev/null 2>&1; then
                echo "Scoped identity cutover found a stale API rollback container." >&2
                exit 1
              fi
              if ! sudo docker container inspect sun-world-api >/dev/null 2>&1; then
                echo "Scoped identity cutover requires the current API container." >&2
                exit 1
              fi
              if [ "$(sudo docker inspect --format '{{.State.Running}}' sun-world-api)" != "true" ]; then
                echo "Scoped identity cutover requires the current API container to be running." >&2
                exit 1
              fi
              if [ "$(sudo docker inspect --format '{{.HostConfig.NetworkMode}}' sun-world-api)" != "host" ] || \
                [ "$(sudo docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' sun-world-api)" != "unless-stopped" ]; then
                echo "Scoped identity cutover supports only the verified host-network, unless-stopped API topology." >&2
                exit 1
              fi
              if ! curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then
                echo "Scoped identity cutover requires the current API container to pass local port-8000 health." >&2
                exit 1
              fi
              PREVIOUS_API_CONTAINER_ID="$(sudo docker inspect --format '{{.Id}}' sun-world-api)"
              PREVIOUS_API_IMAGE="$(sudo docker inspect --format '{{.Config.Image}}' sun-world-api)"
              if [ "$PREVIOUS_API_IMAGE" = "$API_IMAGE" ]; then
                echo "Scoped identity cutover refuses to reapply the reviewed API image." >&2
                exit 1
              fi
              if sudo systemctl is-active --quiet blog-api.service || sudo systemctl is-enabled --quiet blog-api.service; then
                echo "Scoped identity cutover requires the legacy systemd API to remain inactive and disabled." >&2
                exit 1
              fi
              trap identity_exit_trap EXIT
              trap 'exit 130' HUP INT TERM
              sudo docker rename sun-world-api sun-world-api-identity-backup
              IDENTITY_MAINTENANCE_ACTIVE=true
              sudo docker stop sun-world-api-identity-backup >/dev/null
              ;;
            *)
              echo "Unsupported schema mode at deploy boundary: $SCHEMA_MODE" >&2
              exit 1
              ;;
          esac

          if [ "$WEB_CHANGED" = "true" ] && [ "$SCHEMA_MODE" = "full" ]; then
            sudo docker image inspect "$FRONTEND_IMAGE" >/dev/null
            if sudo docker container inspect my-frontend-identity-backup >/dev/null 2>&1; then
              echo "Frontend deploy found a stale rollback container." >&2
              exit 1
            fi
            if ! sudo docker container inspect my-frontend >/dev/null 2>&1 || \
              [ "$(sudo docker inspect --format '{{.State.Running}}' my-frontend 2>/dev/null || true)" != "true" ] || \
              ! curl -fsSI http://127.0.0.1:8081 >/dev/null; then
              echo "Frontend deploy requires the current container to be running and healthy." >&2
              exit 1
            fi
            LEGACY_FRONTEND_CONTAINER_ID="$(sudo docker inspect --format '{{.Id}}' my-frontend)"
            LEGACY_FRONTEND_IMAGE="$(sudo docker inspect --format '{{.Config.Image}}' my-frontend)"
            trap identity_frontend_exit_trap EXIT
            trap 'exit 130' HUP INT TERM
            sudo docker rename my-frontend my-frontend-identity-backup
            IDENTITY_FRONTEND_ROLLBACK_ACTIVE=true
            sudo docker stop my-frontend-identity-backup >/dev/null
            sudo docker run -d --restart unless-stopped --name my-frontend -p 8081:80 "$FRONTEND_IMAGE"
            FRONTEND_LOCAL_READY=false
            for attempt in $(seq 1 20); do
              if curl -fsSI http://127.0.0.1:8081 >/dev/null; then
                FRONTEND_LOCAL_READY=true
                break
              fi
              sleep 2
            done
            if [ "$FRONTEND_LOCAL_READY" != "true" ]; then
              sudo docker ps -a --filter name=my-frontend >&2 || true
              sudo docker inspect --format 'frontend status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' my-frontend >&2 || true
              sudo docker logs --tail 120 my-frontend >&2 || true
              echo "New frontend container failed local port-8081 health." >&2
              exit 1
            fi
          elif [ "$WEB_CHANGED" = "true" ]; then
            echo "Deferring frontend cutover until the scoped API cutover is healthy."
          else
            echo "No frontend deploy needed."
          fi

          if [ "$API_CHANGED" = "true" ]; then
            sudo docker image inspect "$API_IMAGE" >/dev/null
            case "$SCHEMA_MODE" in
              full)
                sudo docker run --rm --network host \
                  "${API_MOUNTS[@]}" \
                  "$API_IMAGE" /bin/sh -lc 'set -euo pipefail; set -a; . /home/lighthouse/.config/blog_end/auth.env; set +a; python -m src.database.mysql.schema_migration --mode apply; python -m src.database.mysql.default_ai_provider_seed --apply'
                ;;
              identity-20260829)
                sudo docker run --rm --network host \
                  "${API_MOUNTS[@]}" \
                  "$API_IMAGE" /bin/sh -lc 'set -euo pipefail; set -a; . /home/lighthouse/.config/blog_end/auth.env; set +a; python -m src.database.mysql.identity_schema_migration --mode apply --acknowledge "$1"; python -m src.database.mysql.identity_schema_migration --mode validate' \
                  identity-migration "$IDENTITY_SCHEMA_ACK"
                ;;
            esac

            API_CORS_ORIGINS="https://sunworld.site,https://www.sunworld.site,https://zsf.shopping,https://www.zsf.shopping"
            API_CSRF_ALLOWED_ORIGINS="https://sunworld.site,https://www.sunworld.site,https://api.sunworld.site"
            API_ENV=(
              -e BLOG_RUNTIME_ENV=production
              -e BLOG_SECRET_ENV_FILE=/home/lighthouse/.config/blog_end/auth.env
              -e BLOG_CORS_ORIGINS="$API_CORS_ORIGINS"
              -e AUTH_CSRF_ALLOWED_ORIGINS="$API_CSRF_ALLOWED_ORIGINS"
              -e BLOG_AUDIT_LOG_DIR=/data/blog/audit-logs
              -e AI_PROVIDER_ALLOWED_HOSTS=api.deepseek.com,openrouter.ai,api.openai.com
              -e AI_PROVIDER_ALLOWED_INSECURE_ORIGINS=http://211.141.18.165:6195
            )

            sudo docker rm -f sun-world-api-candidate || true
            sudo docker run -d --name sun-world-api-candidate --network host \
              "${API_ENV[@]}" \
              -e BLOG_PORT=18000 \
              "${API_MOUNTS[@]}" \
              "$API_IMAGE"
            for attempt in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:18000/healthz >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 20 ]; then
                sudo docker ps -a --filter name=sun-world-api-candidate >&2 || true
                sudo docker inspect --format 'candidate status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' sun-world-api-candidate >&2 || true
                sudo docker logs --tail 120 sun-world-api-candidate >&2 || true
                sudo docker rm -f sun-world-api-candidate || true
                echo "Candidate API container failed health check." >&2
                exit 1
              fi
              sleep 2
            done
            if [ "$SCHEMA_MODE" = "identity-20260829" ] && \
              ! curl -fsS http://127.0.0.1:18000/auth/methods | check_qq_only_auth_methods; then
              echo "Candidate API does not report the reviewed QQ-only OAuth matrix." >&2
              exit 1
            fi
            sudo docker rm -f sun-world-api-candidate

            sudo systemctl stop blog-api.service || true
            sudo systemctl disable blog-api.service || true
            sudo docker rm -f sun-world-api || true
            sudo docker run -d --restart unless-stopped --name sun-world-api --network host \
              "${API_ENV[@]}" \
              -e BLOG_PORT=8000 \
              "${API_MOUNTS[@]}" \
              "$API_IMAGE"

            API_READY=false
            for attempt in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then
                API_READY=true
                break
              fi
              sleep 2
            done
            if [ "$API_READY" != "true" ]; then
              sudo docker ps -a --filter name=sun-world-api >&2 || true
              sudo docker inspect --format 'api status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' sun-world-api >&2 || true
              sudo docker logs --tail 120 sun-world-api >&2 || true
              sudo docker rm -f sun-world-api || true
              if [ "$SCHEMA_MODE" = "full" ]; then
                sudo systemctl enable blog-api.service || true
                sudo systemctl start blog-api.service || true
                echo "Docker API container failed production health check; rolled back to blog-api.service." >&2
              else
                echo "Docker API container failed production health check; the maintenance trap will restore the previous API container." >&2
              fi
              exit 1
            fi
            for attempt in $(seq 1 10); do
              if curl -fsS https://api.sunworld.site/healthz >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 10 ]; then
                echo "Public API health check failed after Docker API cutover." >&2
                exit 1
              fi
              sleep 2
            done
            if [ "$SCHEMA_MODE" = "identity-20260829" ] && \
              ! curl -fsS https://api.sunworld.site/auth/methods | check_qq_only_auth_methods; then
              echo "Public API does not report the reviewed QQ-only OAuth matrix." >&2
              exit 1
            fi
            if [ "$SCHEMA_MODE" = "identity-20260829" ]; then
              IDENTITY_MAINTENANCE_ACTIVE=false
              trap - EXIT HUP INT TERM
              sudo systemctl stop blog-api.service >/dev/null 2>&1 || true
              sudo systemctl disable blog-api.service >/dev/null 2>&1 || true
              if ! sudo docker rm sun-world-api-identity-backup >/dev/null; then
                echo "New API is healthy, but the stopped rollback container requires manual cleanup." >&2
              fi
              if [ "$WEB_CHANGED" = "true" ]; then
                trap identity_frontend_exit_trap EXIT
                trap 'exit 130' HUP INT TERM
                sudo docker rename my-frontend my-frontend-identity-backup
                IDENTITY_FRONTEND_ROLLBACK_ACTIVE=true
                sudo docker stop my-frontend-identity-backup >/dev/null
                sudo docker run -d --restart unless-stopped --name my-frontend -p 8081:80 "$FRONTEND_IMAGE"
                IDENTITY_FRONTEND_LOCAL_READY=false
                for attempt in $(seq 1 20); do
                  if curl -fsSI http://127.0.0.1:8081 >/dev/null; then
                    IDENTITY_FRONTEND_LOCAL_READY=true
                    break
                  fi
                  sleep 2
                done
                if [ "$IDENTITY_FRONTEND_LOCAL_READY" != "true" ]; then
                  sudo docker ps -a --filter name=my-frontend >&2 || true
                  sudo docker inspect --format 'frontend status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' my-frontend >&2 || true
                  sudo docker logs --tail 120 my-frontend >&2 || true
                  echo "New frontend container failed local port-8081 health." >&2
                  exit 1
                fi
              fi
            fi
          else
            echo "No API schema apply needed."
          fi

          sudo docker image prune -f
          if [ "$WEB_CHANGED" = "true" ] || [ "$SCHEMA_MODE" = "full" ]; then
            FRONTEND_READY=false
            for attempt in $(seq 1 10); do
              if curl -fsSI http://127.0.0.1:8081 >/dev/null && \
                curl -fsSI https://sunworld.site >/dev/null && \
                curl -fsSI https://www.sunworld.site >/dev/null; then
                FRONTEND_READY=true
                break
              fi
              sleep 2
            done
            if [ "$FRONTEND_READY" != "true" ]; then
              curl -fsSI http://127.0.0.1:8081
              curl -fsSI https://sunworld.site
              curl -fsSI https://www.sunworld.site
              exit 1
            fi
            if [ "$IDENTITY_FRONTEND_ROLLBACK_ACTIVE" = "true" ]; then
              IDENTITY_FRONTEND_ROLLBACK_ACTIVE=false
              trap - EXIT HUP INT TERM
              if ! sudo docker rm my-frontend-identity-backup >/dev/null; then
                echo "New frontend is healthy, but the stopped rollback container requires manual cleanup." >&2
              fi
            fi
          else
            echo "No frontend post-deploy health check needed for API-only scoped cutover."
          fi
          REMOTE

  no-deploy:
    name: No production deploy
    needs: detect-changes
    if: needs.detect-changes.outputs.any_changed == 'false' || needs.detect-changes.outputs.deploy_needed == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Skip deploy
        run: echo "No production deploy will run for this workflow."
