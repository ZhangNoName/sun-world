      property="og:description"
      content="关注 React、Python、AIGC 与工程实践的个人技术博客。"
    />
    <title>Sun World</title>
    <script data-theme-bootstrap>
      ;(() => {
        let mode = 'system'
        try {
          const stored = JSON.parse(
            localStorage.getItem('sun-world-theme') || 'null'
          )
          if (['light', 'dark', 'system'].includes(stored?.mode)) {
            mode = stored.mode
          } else {
            const legacy = localStorage.getItem('theme')
            if (legacy === 'sun-light' || legacy === 'sun-dark') {
              mode = legacy === 'sun-dark' ? 'dark' : 'light'
            }
          }
        } catch {
          // Storage can be unavailable before the application starts.
        }
        const systemDark =
          typeof matchMedia === 'function' &&
          matchMedia('(prefers-color-scheme: dark)').matches
        const resolved =
          mode === 'system' ? (systemDark ? 'dark' : 'light') : mode
        const root = document.documentElement
        root.dataset.colorMode = resolved
        root.classList.add(resolved === 'dark' ? 'sun-dark' : 'sun-light')
        root.style.colorScheme = resolved
      })()
    </script>
    <script
      defer
      src="https://telegram.org/js/telegram-web-app.js"
      data-request-access="write"
    ></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
