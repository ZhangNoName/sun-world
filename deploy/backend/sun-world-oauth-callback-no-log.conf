# Include this file inside the HTTPS `server` block for api.sunworld.site.
# Exact locations outrank every prefix and regex location. OAuth authorization
# codes and state values must never enter persistent Nginx access or error logs;
# query-free application observability remains available behind this proxy.
location = /auth/oauth/google/callback {
    access_log off;
    error_log /dev/null crit;
    log_subrequest off;
    mirror off;
    auth_request off;
    proxy_intercept_errors off;
    proxy_redirect off;
    proxy_cookie_domain off;
    proxy_cookie_path off;
    proxy_cookie_flags off;
    proxy_pass_request_body off;
    proxy_cache off;
    proxy_store off;
    add_header Referrer-Policy no-referrer always;

    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

